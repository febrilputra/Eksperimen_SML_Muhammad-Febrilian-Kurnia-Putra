name: Telco preprocessing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telco_churn_raw/**'
      - 'preprocessing/automate_*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/preprocessing.yml'
  pull_request:
    paths:
      - 'telco_churn_raw/**'
      - 'preprocessing/automate_*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/preprocessing.yml'
permissions:
  contents: read
jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - name: Install reproducible dependencies
        run: python -m pip install -r requirements.txt
      - name: Check preprocessing contract
        run: python -m pytest tests -q
      - name: Rebuild processed data from raw source
        run: python preprocessing/automate_Muhammad-Febrilian-Kurnia-Putra.py
      - name: Upload newly generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: telco-churn-preprocessing-${{ github.sha }}
          path: preprocessing/telco_churn_preprocessing/
          if-no-files-found: error
          retention-days: 90
